name: Publish package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Distribution destination
        required: true
        default: all
        type: choice
        options: [all, npm, github]

permissions:
  contents: read

concurrency:
  group: provider-icons-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'agenticdriver/provider-icons' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm install --global npm@11.20.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run release:prepare
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: provider-icons-candidate
          path: work/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish and verify npm through trusted publishing
        if: inputs.target == 'all' || inputs.target == 'npm'
        run: npm run release:npm
      - name: Publish the same archive to GitHub Releases
        if: inputs.target == 'all' || inputs.target == 'github'
        run: npm run release:github
        env:
          GH_TOKEN: ${{ github.token }}
